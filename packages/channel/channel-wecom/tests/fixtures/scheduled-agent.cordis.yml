- name: cordis:llm
- name: cordis:session
- name: cordis:projections
- name: cordis:system-prompt
- name: cordis:tools
- name: cordis:agents
- name: cordis:loop
- name: cordis:persistence
  config:
    root: !!js ctx.fixtureRoot + '/sessions'
    compression: none
- name: cordis:storage
- name: cordis:storage-json
  config:
    root: !!js ctx.fixtureRoot + '/storage'
- name: cordis:storage-domain
  config:
    backend: json
- name: cordis:workspace
- name: cordis:archive-gate
- name: cordis:subprocess
- name: cordis:sandbox
- name: cordis:sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js ctx.fixtureRoot
- name: cordis:shell
  config:
    timeoutMs: 60000
- name: cordis:approval
  config:
    policy: never
- name: cordis:permissions
  config:
    presets:
      unattended:
        sandbox: workspace-write
        approval: never
- name: cordis:title
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 40
    maxTitleBytes: 80
- name: cordis:presets
  config:
    default: empty
- name: cordis:preset
  config:
    id: empty
    plugins: []
- name: cordis:typert
- name: cordis:default-model
  config:
    provider: fixture
    model: fixture
- name: cordis:attachments
  config:
    dshHome: !!js ctx.fixtureRoot
- name: cordis:commands
- name: cordis:local-credentials
  config:
    path: !!js ctx.fixtureRoot + '/credentials.yml'
    watch: false
- name: cordis:connection
- name: cordis:file-uploads
- name: cordis:fs
  config:
    cwd: !!js ctx.fixtureRoot
- name: cordis:skills
- name: cordis:skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js ctx.fixtureRoot + '/skills'
    watch: false
- name: cordis:tool-skill
- name: cordis:query
- name: cordis:session-controller
- name: cordis:schedule
  config:
    taskExecutionRecords: !!js ctx.fixtureTaskExecutionRecords
- name: cordis:fixture-model
- name: cordis:fixture-channel
